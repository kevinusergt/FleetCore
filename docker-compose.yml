services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Qwe.123*}
      POSTGRES_DB: ${DB_NAME:-fleet_core}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fleet_core}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
